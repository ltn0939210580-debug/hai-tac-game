name: Build HaiTacMini APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract game source ZIP
        run: |
          echo 'Files in repository:'
          find . -maxdepth 4 -type f -print | sort
          ZIP_FILE="$(find . -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No ZIP file found in this repository.'
            echo 'Upload HaiTacMini-AndroidProject.zip to the repository root, then commit the change.'
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          echo 'Extracted files:'
          find source -maxdepth 4 -type f -print | sort | head -100

      - name: Build APK
        run: |
          PROJECT_DIR="$(find source -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: Could not find settings.gradle.kts inside the extracted ZIP.'
            exit 1
          fi
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaiTacMini-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
