name: Build HaiTacMini APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HaiTacMini-AndroidProject.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game source
        run: |
          unzip -q HaiTacMini-AndroidProject.zip -d source

      - name: Build APK
        working-directory: source/HaiTacMiniAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaiTacMini-APK
          path: source/HaiTacMiniAndroid/app/build/outputs/apk/debug/app-debug.apk
